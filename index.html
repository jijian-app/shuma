<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>数码城 · 即简数码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:#000;color:#fff;min-height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}
.app{height:100vh;display:flex;flex-direction:column}

/* Entry Screen */
.entry{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:32px;padding:40px}
.entry h1{font-size:36px;letter-spacing:8px;font-weight:200}
.entry .sub{color:#888;font-size:14px;letter-spacing:4px}
.entry-btn{width:220px;padding:18px 0;border:1px solid #fff;background:transparent;color:#fff;font-size:17px;letter-spacing:4px;cursor:pointer;text-align:center;transition:.3s}
.entry-btn:hover,.entry-btn:active{background:#fff;color:#000}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid #222;min-height:52px;z-index:1}
.header h2{font-size:17px;letter-spacing:3px;font-weight:400}
.back-btn{font-size:22px;cursor:pointer;padding:4px 8px;color:#888}
.logo-sm{display:flex;align-items:center;gap:6px}
.logo-sm .sq{width:24px;height:24px;border:1px solid #fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;line-height:1}

/* Dots */
.dots{display:flex;justify-content:center;gap:6px;padding:8px 0}.dot{width:5px;height:5px;border-radius:50%;background:#333;transition:.3s}.dot.on{background:#fff;width:18px;border-radius:3px}

/* Swipe */
.pages-wrapper{flex:1;overflow:hidden;position:relative}
.pages{display:flex;height:100%;transition:transform .35s cubic-bezier(.25,.8,.25,1);will-change:transform;touch-action:pan-y}
.page{min-width:100%;height:100%;overflow-y:auto;padding:16px 20px 30px;-webkit-overflow-scrolling:touch}

/* Shared */
.btn{display:block;width:100%;max-width:280px;margin:16px auto;padding:14px 0;border:1px solid #fff;background:#fff;color:#000;font-size:15px;font-weight:600;border-radius:10px;cursor:pointer;text-align:center;transition:opacity .2s;letter-spacing:2px}
.btn:active{opacity:.7}
.btn-outline{background:transparent;color:#fff}
.card{background:#111;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:14px}
.subtitle{color:#888;font-size:13px;text-align:center;margin-top:4px;margin-bottom:12px}

/* Input */
input,textarea,select{width:100%;padding:14px 16px;border-radius:10px;background:#111;border:1px solid #333;color:#fff;font-size:15px;outline:none;font-family:inherit;margin-bottom:10px}
input:focus,textarea:focus,select:focus{border-color:#fff}
textarea{resize:none;min-height:80px}

/* Categories Grid */
.cat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.cat-item{background:#111;border:1px solid #222;border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;transition:.2s}
.cat-item:active{background:#fff;color:#000;border-color:#fff}
.cat-item .ci{font-size:28px;margin-bottom:6px}
.cat-item .ct{font-size:11px;color:#aaa}

/* Product Card */
.prod-list{display:flex;flex-direction:column;gap:12px}
.prod-card{background:#111;border:1px solid #222;border-radius:14px;padding:16px;cursor:pointer;transition:.2s}
.prod-card:active{background:#1a1a1a}
.prod-card .pn{font-size:16px;font-weight:600;margin-bottom:4px}
.prod-card .ps{font-size:12px;color:#888;margin-bottom:8px;line-height:1.5}
.prod-card .pb{display:flex;justify-content:space-between;align-items:center}
.prod-card .pp{font-size:18px;font-weight:700;letter-spacing:1px}
.prod-card .buy-btn{padding:8px 18px;border:1px solid #fff;background:transparent;color:#fff;border-radius:8px;font-size:13px;cursor:pointer;transition:.2s}
.prod-card .buy-btn:active{background:#fff;color:#000}

/* AI Chat */
.chat-box{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;min-height:300px}
.msg{display:flex;gap:8px;max-width:85%}
.msg.ai{align-self:flex-start}.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .face{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#1a1a1a;flex-shrink:0}
.msg .text{padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.6}
.msg.ai .text{background:#111;border:1px solid #222;border-bottom-left-radius:4px}
.msg.mine .text{background:#fff;color:#000;border-bottom-right-radius:4px}
.chat-bar{display:flex;gap:8px;border-top:1px solid #222;padding-top:10px}
.chat-bar input{flex:1;margin-bottom:0;padding:12px 16px;border-radius:22px}
.chat-bar button{padding:12px 20px;border-radius:22px;border:none;background:#fff;color:#000;font-size:14px;font-weight:600;cursor:pointer}
.chat-bar button:active{opacity:.7}

/* Orders */
.order-card{background:#111;border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px}
.order-card .oi{font-size:12px;color:#888;margin-bottom:4px}
.order-card .op{font-size:16px;font-weight:600}
.order-card .os{font-size:13px;margin-top:4px}
.os-pending{color:#888}.os-shipped{color:#ccc}.os-delivered{color:#fff}

/* Modal */
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:100}
.modal{background:#111;border:1px solid #333;border-radius:16px;padding:24px;width:90%;max-width:380px;max-height:80vh;overflow-y:auto}
.modal h3{text-align:center;margin-bottom:16px;letter-spacing:2px;font-weight:400}
.modal .close{float:right;font-size:22px;cursor:pointer;color:#888}

/* Merchant */
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px}
.stat-card{background:#111;border:1px solid #222;border-radius:12px;padding:16px;text-align:center}
.stat-card .sv{font-size:28px;font-weight:700;margin-bottom:4px}
.stat-card .sl{font-size:12px;color:#888}

.tabs{display:flex;gap:0;margin-bottom:16px;border-bottom:1px solid #222}
.tab{padding:10px 20px;font-size:14px;cursor:pointer;color:#888;border-bottom:2px solid transparent;transition:.2s}
.tab.on{color:#fff;border-bottom-color:#fff}

.merch-prod{border:1px solid #222;border-radius:12px;padding:14px;margin-bottom:10px;background:#111}
.merch-prod .mpn{font-size:15px;font-weight:600}
.merch-prod .mps{font-size:12px;color:#888;margin:4px 0}
.merch-prod .mpa{display:flex;gap:8px;margin-top:8px}
.merch-prod .mpa button{flex:1;padding:8px;font-size:12px;border:1px solid #333;border-radius:6px;background:transparent;color:#fff;cursor:pointer}

.hidden{display:none!important}
.flex-col{display:flex;flex-direction:column}
.gap-sm{gap:10px}
.page-full{display:flex;flex-direction:column;min-height:100%}

select{appearance:none;-webkit-appearance:none}
</style>
</head>
<body>

<div class="app" id="app">
<!-- ==================== ENTRY ==================== -->
<div id="entryScreen" class="entry">
  <div class="logo-sm" style="margin-bottom:8px">
    <div class="sq" style="width:42px;height:42px;border-radius:10px;font-size:14px">即<br>简</div>
  </div>
  <h1>数码城</h1>
  <div class="sub">即简数码 · 购你所想</div>
  <div style="height:20px"></div>
  <button class="entry-btn" onclick="enterPlatform('customer')">客户平台</button>
  <button class="entry-btn" onclick="enterPlatform('merchant')">商家平台</button>
</div>

<!-- ==================== CUSTOMER ==================== -->
<div id="customerScreen" class="hidden" style="height:100vh;display:flex;flex-direction:column">
  <div class="header">
    <div class="logo-sm"><div class="sq">即<br>简</div><h2>数码城</h2></div>
    <span style="font-size:12px;color:#888;cursor:pointer" onclick="backToEntry()">← 退出</span>
  </div>
  <div class="dots" id="cdots">
    <div class="dot on" data-i="0"></div><div class="dot" data-i="1"></div><div class="dot" data-i="2"></div>
  </div>
  <div class="pages-wrapper" id="cwrapper">
    <div class="pages" id="cpages">

      <!-- Page 1: Products -->
      <div class="page">
        <div class="cat-grid" id="catGrid"></div>
        <div class="subtitle" id="catTitle">选择分类查看产品</div>
        <div class="prod-list" id="prodList"></div>
      </div>

      <!-- Page 2: AI Chat -->
      <div class="page page-full">
        <div class="chat-box" id="aibox">
          <div class="msg ai"><div class="face">🤖</div><div class="text">你好！我是数码城 AI 导购<br>告诉我你的预算和需求，帮你精准推荐 ✨<br><br>例如：<br>"预算5000，学生用，续航好拍照清晰"<br>"3000以内性价比最高的手机"</div></div>
        </div>
        <div class="chat-bar">
          <input type="text" id="aiin" placeholder="说说你的需求...">
          <button id="aisend">发送</button>
        </div>
      </div>

      <!-- Page 3: Account & Orders -->
      <div class="page">
        <div class="card" id="loginCard">
          <h3 style="text-align:center;letter-spacing:2px;font-weight:400;margin-bottom:14px">登录 / 注册</h3>
          <input type="text" id="userPhone" placeholder="手机号">
          <input type="password" id="userPass" placeholder="密码">
          <button class="btn" onclick="doLogin()">登录</button>
          <button class="btn btn-outline" onclick="doRegister()">注册新账号</button>
        </div>
        <div class="card hidden" id="accountCard">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span style="font-weight:600" id="accName">用户</span>
            <button class="btn-outline" style="padding:6px 14px;font-size:12px;border-radius:6px" onclick="doLogout()">退出</button>
          </div>
        </div>
        <h3 style="margin:16px 0 10px;letter-spacing:2px;font-weight:400">我的订单</h3>
        <div id="orderList"><div style="color:#888;text-align:center;padding:30px">暂无订单</div></div>
      </div>

    </div>
  </div>
</div>

<!-- ==================== MERCHANT ==================== -->
<div id="merchantScreen" class="hidden" style="height:100vh;display:flex;flex-direction:column">
  <!-- Login -->
  <div id="merchLogin" class="entry" style="gap:20px">
    <div class="logo-sm" style="margin-bottom:8px">
      <div class="sq" style="width:42px;height:42px;border-radius:10px;font-size:14px">即<br>简</div>
    </div>
    <h1 style="font-size:28px;letter-spacing:6px">商家后台</h1>
    <input type="text" id="inviteCode" placeholder="请输入邀请码" style="max-width:260px">
    <button class="entry-btn" onclick="merchantLogin()">进入管理</button>
    <button class="entry-btn" style="border-color:#333;color:#888" onclick="backToEntry()">← 返回</button>
  </div>

  <!-- Dashboard -->
  <div id="merchDash" class="hidden" style="height:100vh;display:flex;flex-direction:column">
    <div class="header">
      <div class="logo-sm"><div class="sq">即<br>简</div><h2>商家管理</h2></div>
      <span style="font-size:12px;color:#888;cursor:pointer" onclick="merchantLogout()">退出</span>
    </div>
    <div class="page" style="flex:1">
      <div class="stat-cards">
        <div class="stat-card"><div class="sv" id="statProd">0</div><div class="sl">商品数量</div></div>
        <div class="stat-card"><div class="sv" id="statOrder">0</div><div class="sl">总订单</div></div>
        <div class="stat-card"><div class="sv" id="statUser">0</div><div class="sl">注册用户</div></div>
      </div>
      <div class="tabs">
        <div class="tab on" onclick="merchTab('products',this)">商品管理</div>
        <div class="tab" onclick="merchTab('orders',this)">订单管理</div>
        <div class="tab" onclick="merchTab('users',this)">用户管理</div>
      </div>
      <div id="merchProducts">
        <div style="display:flex;gap:10px;margin-bottom:14px">
          <button class="btn" style="margin:0;flex:1" onclick="showAddProduct()">+ 添加商品</button>
        </div>
        <div id="merchProdList"></div>
      </div>
      <div id="merchOrders" class="hidden">
        <div id="merchOrderList"></div>
      </div>
      <div id="merchUsers" class="hidden">
        <div style="display:flex;gap:10px;margin-bottom:14px">
          <button class="btn btn-outline" style="margin:0;flex:1" onclick="exportUsers()">📥 导出用户数据</button>
          <button class="btn btn-outline" style="margin:0;flex:1;border-color:#888;color:#888" onclick="clearUsers()">清空</button>
        </div>
        <div id="merchUserList"></div>
      </div>
    </div>
  </div>
</div>

</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ===== DATA =====
var PRODUCTS = JSON.parse(localStorage.getItem('sc_products')||'[]');
var ORDERS = JSON.parse(localStorage.getItem('sc_orders')||'[]');
var USERS = JSON.parse(localStorage.getItem('sc_users')||'[]');
var currentUser = JSON.parse(localStorage.getItem('sc_currentUser')||'null');
var MERCHANT_LOGGED = false;
var INVITE_CODE = 'Qq223345678';
var currentCat = 'all';

// Default products
var defaultProducts = [
  {id:1,cat:'smartphone',name:'小米15',spec:'骁龙8至尊版 / 6.36" 1.5K直屏 / 5400mAh / 徕卡三摄',price:4499,img:'📱'},
  {id:2,cat:'smartphone',name:'iPhone 16 Pro',spec:'A18 Pro / 6.3" OLED / 48MP主摄 / 钛金属',price:7999,img:'📱'},
  {id:3,cat:'smartphone',name:'华为Mate 70 Pro',spec:'麒麟9020 / 6.8" LTPO / 卫星通信 / 鸿蒙OS',price:6499,img:'📱'},
  {id:4,cat:'smartphone',name:'iQOO 13',spec:'骁龙8至尊版 / 2K直屏 / 6150mAh / 120W快充',price:3999,img:'📱'},
  {id:5,cat:'laptop',name:'联想拯救者Y9000P',spec:'i9-14900HX / RTX4060 / 16" 2.5K 240Hz',price:8999,img:'💻'},
  {id:6,cat:'laptop',name:'MacBook Air M3',spec:'M3芯片 / 13.6" Liquid Retina / 15h续航',price:7999,img:'💻'},
  {id:7,cat:'laptop',name:'Redmi Book Pro 15',spec:'R7-7840HS / 15.6" 3.2K 120Hz / 金属机身',price:5999,img:'💻'},
  {id:8,cat:'tablet',name:'iPad Air M2',spec:'M2芯片 / 11" Liquid Retina / 支持Apple Pencil',price:4799,img:'📋'},
  {id:9,cat:'tablet',name:'华为MatePad Pro',spec:'麒麟9000S / 13.2" OLED / 鸿蒙OS',price:4299,img:'📋'},
  {id:10,cat:'earphone',name:'AirPods Pro 2',spec:'H2芯片 / ANC主动降噪 / MagSafe充电',price:1899,img:'🎧'},
  {id:11,cat:'earphone',name:'华为FreeBuds Pro 3',spec:'麒麟A2 / 静谧通话 / 星闪连接',price:1499,img:'🎧'},
  {id:12,cat:'wearable',name:'Apple Watch S9',spec:'S9芯片 / 全天候视网膜 / 血氧监测',price:2999,img:'⌚'},
  {id:13,cat:'wearable',name:'小米手环8 Pro',spec:'1.74" AMOLED / 14天续航 / 150+运动',price:399,img:'⌚'},
  {id:14,cat:'accessory',name:'小米充电宝 20000mAh',spec:'20000mAh / 50W双向快充 / Type-C',price:199,img:'🔌'},
  {id:15,cat:'accessory',name:'Anker氮化镓65W',spec:'65W / GaN / 双口快充 / 折叠插脚',price:149,img:'🔌'}
];

if(!PRODUCTS.length){PRODUCTS=defaultProducts;saveProducts();}

var categories = [
  {id:'all',name:'全部',icon:'🛍️'},
  {id:'smartphone',name:'手机',icon:'📱'},
  {id:'laptop',name:'笔记本',icon:'💻'},
  {id:'tablet',name:'平板',icon:'📋'},
  {id:'earphone',name:'耳机',icon:'🎧'},
  {id:'wearable',name:'穿戴',icon:'⌚'},
  {id:'accessory',name:'配件',icon:'🔌'}
];

function saveProducts(){localStorage.setItem('sc_products',JSON.stringify(PRODUCTS))}
function saveOrders(){localStorage.setItem('sc_orders',JSON.stringify(ORDERS))}
function saveUsers(){localStorage.setItem('sc_users',JSON.stringify(USERS))}

// ===== ENTRY =====
function enterPlatform(type){
  document.getElementById('entryScreen').classList.add('hidden');
  if(type==='customer'){
    document.getElementById('customerScreen').classList.remove('hidden');
    document.getElementById('customerScreen').style.display='flex';
    initCustomer();
  }else{
    document.getElementById('merchantScreen').classList.remove('hidden');
    document.getElementById('merchantScreen').style.display='block';
    document.getElementById('merchLogin').style.display='flex';
  }
}

function backToEntry(){
  document.getElementById('customerScreen').classList.add('hidden');
  document.getElementById('merchantScreen').classList.add('hidden');
  document.getElementById('entryScreen').classList.remove('hidden');
  MERCHANT_LOGGED=false;
  document.getElementById('merchLogin').style.display='flex';
  document.getElementById('merchDash').classList.add('hidden');
}

// ===== CUSTOMER INIT =====
function initCustomer(){
  currentUser = JSON.parse(localStorage.getItem('sc_currentUser')||'null');
  renderCats();
  renderProds('all');
  initSwipe('cwrapper','cpages','cdots');
  document.getElementById('aisend').addEventListener('click',aiChat);
  document.getElementById('aiin').addEventListener('keydown',function(e){if(e.key==='Enter')aiChat()});
  updateAccountUI();
}

function renderCats(){
  var h='';
  categories.forEach(function(c){
    h+='<div class="cat-item" onclick="selectCat(\''+c.id+'\')"><div class="ci">'+c.icon+'</div><div class="ct">'+c.name+'</div></div>';
  });
  document.getElementById('catGrid').innerHTML=h;
}

function selectCat(cid){
  currentCat=cid;
  var cn=categories.find(function(c){return c.id===cid});
  document.getElementById('catTitle').textContent=cn?cn.name+' · 热门推荐':'全部产品';
  renderProds(cid);
}

function renderProds(cid){
  var prods=cid==='all'?PRODUCTS:PRODUCTS.filter(function(p){return p.cat===cid});
  var h='';
  prods.forEach(function(p){
    h+='<div class="prod-card"><div class="pn">'+p.img+' '+p.name+'</div><div class="ps">'+p.spec+'</div><div class="pb"><span class="pp">¥'+p.price.toLocaleString()+'</span><button class="buy-btn" onclick="buyProduct('+p.id+')">购买</button></div></div>';
  });
  if(!prods.length)h='<div style="color:#888;text-align:center;padding:30px">该分类暂无产品</div>';
  document.getElementById('prodList').innerHTML=h;
}

// ===== BUY =====
function buyProduct(pid){
  if(!currentUser){alert('请先在第三页登录/注册');return;}
  var p=PRODUCTS.find(function(x){return x.id===pid});
  if(!p)return;
  var order={id:Date.now(),pid:pid,pname:p.name,price:p.price,img:p.img,userId:currentUser.phone,status:'pending',tracking:'',time:new Date().toLocaleString()};
  ORDERS.unshift(order);saveOrders();
  alert('已下单：'+p.name+' ¥'+p.price.toLocaleString()+'\n可在第三页查看订单');
  renderOrders();
}

// ===== AI CHAT =====
function aiChat(){
  var inp=document.getElementById('aiin');
  var t=inp.value.trim();if(!t)return;
  addAIMsg(t,'mine');inp.value='';
  setTimeout(function(){addAIMsg(aiReply(t),'ai')},600+Math.random()*800);
}

function addAIMsg(t,who){
  var d=document.createElement('div');d.className='msg '+who;
  d.innerHTML='<div class="face">'+(who==='ai'?'🤖':'😊')+'</div><div class="text">'+t.replace(/\n/g,'<br>')+'</div>';
  document.getElementById('aibox').appendChild(d);
  document.getElementById('aibox').scrollTop=document.getElementById('aibox').scrollHeight;
}

function aiReply(t){
  t=t.toLowerCase();
  var budget=0;var m=t.match(/(\d+)\s*(块|元|k|千|万|百|以内)/);
  if(m){budget=parseInt(m[1]);if(m[2]==='k'||m[2]==='千')budget*=1000;if(m[2]==='万')budget*=10000;}

  var cats=[];var kw={'手机':'smartphone','笔记本':'laptop','平板':'tablet','耳机':'earphone','手表':'wearable','配件':'accessory'};
  Object.keys(kw).forEach(function(k){if(t.indexOf(k)>-1)cats.push(kw[k])});
  if(!cats.length)cats.push('smartphone');

  var prods=PRODUCTS.filter(function(p){return cats.indexOf(p.cat)>-1});
  if(budget>0)prods=prods.filter(function(p){return p.price<=budget*1.2});
  prods.sort(function(a,b){return a.price-b.price});
  prods=prods.slice(0,4);

  if(!prods.length)return '抱歉，没有找到匹配的产品 😔\n请试试放宽预算或换一种描述~';

  var rep='🔍 **为你找到 '+prods.length+' 款推荐：**\n\n';
  prods.forEach(function(p,i){
    rep+=(i+1)+'. '+p.img+' **'+p.name+'**  ¥'+p.price.toLocaleString()+'\n   '+p.spec+'\n\n';
  });
  rep+='💡 如需更多细节或对比，请告诉我~';
  return rep;
}

// ===== ACCOUNT =====
function doLogin(){
  var ph=document.getElementById('userPhone').value.trim();
  var pw=document.getElementById('userPass').value.trim();
  if(!ph||!pw){alert('请填写手机号和密码');return;}
  var u=USERS.find(function(x){return x.phone===ph&&x.pass===pw});
  if(!u){alert('账号或密码错误');return;}
  currentUser=u;localStorage.setItem('sc_currentUser',JSON.stringify(u));updateAccountUI();
}

function doRegister(){
  var ph=document.getElementById('userPhone').value.trim();
  var pw=document.getElementById('userPass').value.trim();
  if(!ph||!pw){alert('请填写手机号和密码');return;}
  if(USERS.find(function(x){return x.phone===ph})){alert('该手机号已注册');return;}
  var u={phone:ph,pass:pw,name:'用户'+ph.slice(-4)};
  USERS.push(u);saveUsers();
  currentUser=u;localStorage.setItem('sc_currentUser',JSON.stringify(u));updateAccountUI();
  alert('注册成功！欢迎 '+u.name);
}

function doLogout(){currentUser=null;localStorage.removeItem('sc_currentUser');updateAccountUI()}

function updateAccountUI(){
  if(currentUser){
    document.getElementById('loginCard').classList.add('hidden');
    document.getElementById('accountCard').classList.remove('hidden');
    document.getElementById('accName').textContent='👤 '+currentUser.name;
  }else{
    document.getElementById('loginCard').classList.remove('hidden');
    document.getElementById('accountCard').classList.add('hidden');
  }
  renderOrders();
}

function renderOrders(){
  if(!currentUser){document.getElementById('orderList').innerHTML='<div style="color:#888;text-align:center;padding:30px">请先登录查看订单</div>';return}
  var os=ORDERS.filter(function(o){return o.userId===currentUser.phone});
  if(!os.length){document.getElementById('orderList').innerHTML='<div style="color:#888;text-align:center;padding:30px">暂无订单</div>';return}
  var st={'pending':'⏳ 待处理','shipped':'📦 已发货','delivered':'✅ 已签收'};
  var h='';
  os.forEach(function(o){
    h+='<div class="order-card"><div class="oi">'+o.time+'</div><div class="op">'+o.img+' '+o.pname+'</div><div style="font-weight:700;margin:4px 0">¥'+o.price.toLocaleString()+'</div><div class="os os-'+o.status+'">'+st[o.status]+'</div>';
    if(o.tracking)h+='<div style="font-size:12px;color:#888;margin-top:4px">物流：'+o.tracking+'</div>';
    h+='</div>';
  });
  document.getElementById('orderList').innerHTML=h;
}

// ===== SWIPE =====
function initSwipe(wrapperId,pagesId,dotsId){
  var cur=0,total=3,sx=0,sy=0,swiping=false,moved=false;
  var w=document.getElementById(wrapperId),p=document.getElementById(pagesId),dots=document.querySelectorAll('#'+dotsId+' .dot');

  function go(n){
    if(n<0||n>=total)return;cur=n;
    p.style.transform='translateX(-'+(n*100)+'%)';
    dots.forEach(function(d,i){d.classList.toggle('on',i===n)});
  }

  w.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;swiping=true;moved=false;p.style.transition='none'},{passive:true});
  w.addEventListener('touchmove',function(e){
    if(!swiping)return;
    var dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
    if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>5){moved=true;e.preventDefault();
      var off=-cur*100+(dx/w.offsetWidth)*100;
      off=Math.max(-(total-1)*100,Math.min(0,off));
      p.style.transform='translateX('+off+'%)'}
  },{passive:false});
  w.addEventListener('touchend',function(e){
    if(!swiping)return;swiping=false;
    p.style.transition='transform .35s cubic-bezier(.25,.8,.25,1)';
    var dx=e.changedTouches[0].clientX-sx;
    if(moved&&Math.abs(dx)>60){go(dx<0?cur+1:cur-1)}else{go(cur)}
  });
  document.getElementById(dotsId).addEventListener('click',function(e){var i=parseInt(e.target.dataset.i);if(!isNaN(i))go(i)});
}

// ===== MERCHANT =====
function merchantLogin(){
  var code=document.getElementById('inviteCode').value.trim();
  if(code!==INVITE_CODE){alert('邀请码错误');return}
  MERCHANT_LOGGED=true;
  document.getElementById('merchLogin').style.display='none';
  document.getElementById('merchDash').classList.remove('hidden');
  refreshMerchant();
}

function merchantLogout(){MERCHANT_LOGGED=false;document.getElementById('merchDash').classList.add('hidden');document.getElementById('merchLogin').style.display='flex';document.getElementById('inviteCode').value=''}

function refreshMerchant(){
  document.getElementById('statProd').textContent=PRODUCTS.length;
  document.getElementById('statOrder').textContent=ORDERS.length;
  renderMerchProds();
  renderMerchOrders();
  renderMerchUsers();
}

function merchTab(t,el){
  document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
  el.classList.add('on');
  document.getElementById('merchProducts').classList.toggle('hidden',t!=='products');
  document.getElementById('merchOrders').classList.toggle('hidden',t!=='orders');
  document.getElementById('merchUsers').classList.toggle('hidden',t!=='users');
}

function renderMerchProds(){
  var h='';
  PRODUCTS.forEach(function(p){
    var cn=categories.find(function(c){return c.id===p.cat});
    h+='<div class="merch-prod"><div class="mpn">'+p.img+' '+p.name+'</div><div class="mps">'+cn.name+' | ¥'+p.price.toLocaleString()+'</div><div class="mps">'+p.spec+'</div><div class="mpa"><button onclick="editProduct('+p.id+')">编辑</button><button onclick="deleteProduct('+p.id+')" style="color:#f66;border-color:#f66">删除</button></div></div>';
  });
  if(!h)h='<div style="color:#888;text-align:center;padding:30px">暂无商品，点击上方添加</div>';
  document.getElementById('merchProdList').innerHTML=h;
}

function showAddProduct(){
  var copt=categories.filter(function(c){return c.id!=='all'}).map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>'}).join('');
  var h='<h3>添加商品</h3><span class="close" onclick="closeModal()">✕</span>';
  h+='<select id="addCat">'+copt+'</select>';
  h+='<input id="addName" placeholder="商品名称">';
  h+='<input id="addSpec" placeholder="规格描述">';
  h+='<input id="addPrice" type="number" placeholder="价格（元）">';
  h+='<button class="btn" onclick="doAddProduct()">确认添加</button>';
  document.getElementById('modalContent').innerHTML=h;
  document.getElementById('modal').style.display='flex';
}

function doAddProduct(){
  var p={id:Date.now(),cat:document.getElementById('addCat').value,name:document.getElementById('addName').value.trim(),spec:document.getElementById('addSpec').value.trim(),price:parseInt(document.getElementById('addPrice').value)||0,img:'📱'};
  if(!p.name||!p.price){alert('请填写名称和价格');return}
  PRODUCTS.push(p);saveProducts();closeModal();refreshMerchant();
}

function editProduct(pid){
  var p=PRODUCTS.find(function(x){return x.id===pid});if(!p)return;
  var copt=categories.filter(function(c){return c.id!=='all'}).map(function(c){return '<option value="'+c.id+'"'+(c.id===p.cat?' selected':'')+'>'+c.name+'</option>'}).join('');
  var h='<h3>编辑商品</h3><span class="close" onclick="closeModal()">✕</span>';
  h+='<select id="editCat">'+copt+'</select>';
  h+='<input id="editName" value="'+p.name+'">';
  h+='<input id="editSpec" value="'+p.spec+'">';
  h+='<input id="editPrice" type="number" value="'+p.price+'">';
  h+='<button class="btn" onclick="doEditProduct('+pid+')">保存修改</button>';
  document.getElementById('modalContent').innerHTML=h;
  document.getElementById('modal').style.display='flex';
}

function doEditProduct(pid){
  var p=PRODUCTS.find(function(x){return x.id===pid});if(!p)return;
  p.cat=document.getElementById('editCat').value;p.name=document.getElementById('editName').value.trim();
  p.spec=document.getElementById('editSpec').value.trim();p.price=parseInt(document.getElementById('editPrice').value)||0;
  saveProducts();closeModal();refreshMerchant();
}

function deleteProduct(pid){
  if(!confirm('确定删除该商品？'))return;
  PRODUCTS=PRODUCTS.filter(function(p){return p.id!==pid});saveProducts();refreshMerchant();
}

function renderMerchOrders(){
  var st={'pending':'⏳ 待处理','shipped':'📦 已发货','delivered':'✅ 已签收'};
  var h='';
  ORDERS.forEach(function(o){
    var buyer=USERS.find(function(u){return u.phone===o.userId});
    h+='<div class="order-card"><div class="oi">'+o.time+' | 买家：'+(buyer?buyer.name:o.userId)+'</div><div class="op">'+o.img+' '+o.pname+' ¥'+o.price.toLocaleString()+'</div><div class="os os-'+o.status+'" style="margin:6px 0">'+st[o.status]+'</div>';
    if(o.tracking)h+='<div style="font-size:12px;color:#888">物流：'+o.tracking+'</div>';
    h+='<div style="display:flex;gap:6px;margin-top:6px">';
    if(o.status==='pending')h+='<button style="padding:6px 12px;font-size:12px;border:1px solid #fff;background:transparent;color:#fff;border-radius:6px" onclick="updateOrderStatus('+o.id+',\'shipped\')">标记发货</button>';
    if(o.status==='shipped'){
      h+='<input id="track_'+o.id+'" placeholder="输入物流单号" style="flex:1;margin:0;padding:6px 10px;font-size:12px">';
      h+='<button style="padding:6px 12px;font-size:12px;border:1px solid #fff;background:transparent;color:#fff;border-radius:6px" onclick="doTracking('+o.id+')">更新物流</button>';
    }
    h+='</div></div>';
  });
  if(!h)h='<div style="color:#888;text-align:center;padding:30px">暂无订单</div>';
  document.getElementById('merchOrderList').innerHTML=h;
}

function updateOrderStatus(oid,status){
  var o=ORDERS.find(function(x){return x.id===oid});if(!o)return;
  o.status=status;saveOrders();refreshMerchant();renderOrders();
}

function doTracking(oid){
  var o=ORDERS.find(function(x){return x.id===oid});
  var tn=document.getElementById('track_'+oid);
  if(!o||!tn)return;
  o.tracking=tn.value.trim();
  if(o.tracking){o.status='delivered'}
  saveOrders();refreshMerchant();renderOrders();
}

function closeModal(){document.getElementById('modal').style.display='none'}

// ==== USER MANAGEMENT ====
function renderMerchUsers(){
  var h='';
  if(!USERS.length){h='<div style="color:#888;text-align:center;padding:30px">暂无注册用户</div>'}
  else{
    h+='<div style="color:#888;font-size:12px;margin-bottom:8px">共 '+USERS.length+' 位注册用户</div>';
    USERS.forEach(function(u,i){
      h+='<div class="order-card"><div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font-weight:600">👤 '+u.name+'</div><div style="font-size:13px;color:#aaa">📱 '+u.phone+'</div><div style="font-size:13px;color:#aaa">🔑 '+u.pass+'</div></div><span style="font-size:11px;color:#666">#'+(i+1)+'</span></div></div>';
    });
  }
  document.getElementById('merchUserList').innerHTML=h;
}

function exportUsers(){
  if(!USERS.length){alert('无用户数据可导出');return}
  var txt='数码城 · 注册用户数据\n导出时间: '+new Date().toLocaleString()+'\n共 '+USERS.length+' 人\n'+'='.repeat(40)+'\n\n';
  USERS.forEach(function(u,i){
    txt+=(i+1)+'. 姓名: '+u.name+'\n   手机: '+u.phone+'\n   密码: '+u.pass+'\n\n';
  });
  var blob=new Blob([txt],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='数码城_用户数据_'+new Date().toISOString().slice(0,10)+'.txt';a.click();
}

function clearUsers(){
  if(!confirm('确定清空所有用户数据？此操作不可恢复！'))return;
  USERS=[];saveUsers();refreshMerchant();
}
document.getElementById('modal').addEventListener('click',function(e){if(e.target===this)closeModal()});

// Init merchant login screen
document.getElementById('merchLogin').style.display='none';
</script>
